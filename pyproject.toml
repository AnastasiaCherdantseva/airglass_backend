[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "airglass-backend"
version = "0.1.0"
description = "FastAPI backend airglass"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.104.1",
    "uvicorn[standard]==0.24.0",
    "sqlalchemy==2.0.40",
    "greenlet==3.1.1",
    "python-dotenv==1.0.0",
    "asyncpg",
    "pydantic-settings",
    "alembic",
    "pwdlib[bcrypt]>=0.2.0",
]
[tool.setuptools.packages.find]
include = ["app*", "scripts*"]
exclude = ["migrations*", "tests*"]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "black>=23.0.0",
]
